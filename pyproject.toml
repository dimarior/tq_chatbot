[project]
name = "tq-chatbot"
version = "0.1.0"
description = "RAG chatbot sobre Tecnoquímicas — FastAPI + Qwen3 + Chroma"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.1.140",
    "chromadb>=0.5.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

# Dependencias del bonus t-SNE/UMAP (notebooks/intent_tsne.ipynb).
# Instalar/ejecutar con:  uv run --group notebooks ...
[dependency-groups]
notebooks = [
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.6",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "jupyter>=1.1.0",
    "nbconvert>=7.16.0",
]
